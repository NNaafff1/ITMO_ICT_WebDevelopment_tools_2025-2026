name: Deploy Lab 2 Docs

# Деплой документации Lab 2 на GitHub Pages.
# Запускается при пуше в lab2 или main, когда меняются файлы lab2/docs/ или mkdocs.yml.

on:
  push:
    branches: [lab2, main, master]
    paths:
      - 'lab2/docs/**'
      - 'lab2/mkdocs.yml'
      - '.github/workflows/lab2-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build docs
        working-directory: lab2
        run: mkdocs build --site-dir ../_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
