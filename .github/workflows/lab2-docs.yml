name: Deploy Lab 2 Docs

# Деплоит документацию Lab 2 в ветку gh-pages в подпапку lr2/,
# НЕ затрагивая существующий сайт Lab 1 в корне.
#
# Итоговый URL:
#   https://nnaafff1.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026/lr2/

on:
  push:
    branches: [lab2, main, master]
    paths:
      - 'students/k3341/saeed_nawaf/lr2/**'
      - '.github/workflows/lab2-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-lab2"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build Lab 2 docs
        working-directory: students/k3341/saeed_nawaf/lr2
        run: mkdocs build --site-dir ../../../../_site_lr2

      - name: Deploy to gh-pages /lr2/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_lr2
          destination_dir: lr2
          keep_files: true
          commit_message: "deploy: lab2 docs to /lr2/"
